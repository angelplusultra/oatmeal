appId: app.oatmeal.desktop
productName: Oatmeal
copyright: Copyright © 2026 Marcello Fitton
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  # node-llama-cpp ships binaries per platform; keep only this platform's (see its Electron guide).
  - '!node_modules/node-llama-cpp/bins/**/*'
  - 'node_modules/node-llama-cpp/bins/${os}-${arch}*/**/*'
  - '!node_modules/@node-llama-cpp/*/bins/**/*'
  - 'node_modules/@node-llama-cpp/${os}-${arch}*/bins/**/*'
  - '!node_modules/node-llama-cpp/llama/localBuilds/**/*'
  - 'node_modules/node-llama-cpp/llama/localBuilds/${os}-${arch}*/**/*'

# Native binaries cannot be loaded from inside the asar archive.
asarUnpack:
  - node_modules/node-llama-cpp/bins
  - node_modules/node-llama-cpp/llama/localBuilds
  - node_modules/@node-llama-cpp/*
  - node_modules/koffi/**

# The audio helper (macOS only), the native Moonshine library and the tray icons live in the resources dir.
extraResources:
  - from: resources/bin
    to: bin
  - from: resources/moonshine/${platform}-${arch}
    to: moonshine/${platform}-${arch}
  - from: resources/tray
    to: tray

npmRebuild: false

# Self-updates (electron-updater) read latest-mac.yml / latest-linux.yml (beta-*.yml for beta versions) from
# GitHub Releases. The release workflow uploads them; it runs with `--publish never`, so this only sets the feed.
publish:
  provider: github
  owner: angelplusultra
  repo: oatmeal

mac:
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  category: public.app-category.productivity
  # libmoonshine.dylib from the moonshine-voice wheel targets macOS 15+.
  minimumSystemVersion: '15.0'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Oatmeal transcribes what you say during your calls. Audio is processed on this Mac and never saved or uploaded.
    NSAudioCaptureUsageDescription: Oatmeal transcribes the other people on your calls. Audio is processed on this Mac and never saved or uploaded.

# Linux needs PipeWire (pw-record, and pactl from pipewire-pulse) at runtime instead of the helper.
linux:
  target:
    - target: AppImage
      arch: x64
    - target: pacman
      arch: x64
  category: Office
  executableName: oatmeal
  synopsis: Private, local meeting notes
pacman:
  depends: [pipewire, pipewire-pulse]

dmg:
  title: Oatmeal
