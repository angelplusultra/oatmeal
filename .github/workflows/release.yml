name: Release

# Push a tag like v0.2.0 (`npm version minor` does it) to build and publish a GitHub Release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform failing shouldn't cancel the other's build (Linux packaging alone takes ~13 min).
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: --mac
          - os: ubuntu-24.04
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # setup.mjs unpacks the Moonshine wheel with bsdtar on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package
        env:
          # Optional. Without CSC_LINK the macOS app is ad-hoc signed and not notarized.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          args=(${{ matrix.target }} --config electron-builder.yml --publish never)
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            args+=(-c.mac.identity=-)
          fi
          # After Apple accepts the app, stapling fetches the ticket from Apple's CloudKit server, and on GitHub's
          # macOS runners that connection often drops (NSURLErrorDomain -1005, "Failed to staple ... code: 68").
          # stapler doesn't retry, so retry the package step, but only for that failure.
          set -o pipefail
          for attempt in 1 2 3; do
            npx electron-builder "${args[@]}" 2>&1 | tee package.log && exit 0
            grep -q 'Failed to staple' package.log || exit 1
            echo "::warning::Stapling failed on attempt $attempt (Apple's ticket server dropped the connection). Retrying."
            sleep 60
          done
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.pacman
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a pre-release suffix (v1.0.0-beta.1) publish as pre-releases.
          pre=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes $pre

  # Updates the oatmeal-notes-bin AUR package. Skipped until the AUR_SSH_PRIVATE_KEY secret exists: an SSH key added
  # to the AUR account that maintains the package (packaging/aur/PKGBUILD).
  aur:
    needs: publish
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - if: env.AUR_SSH_PRIVATE_KEY == ''
        run: echo "::notice::AUR_SSH_PRIVATE_KEY isn't set, so the AUR package wasn't updated."
      - if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: actions/checkout@v5
      - name: Publish to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        run: |
          pacman -Syu --noconfirm --needed git openssh
          # makepkg refuses to run as root.
          useradd -m builder
          install -d -m 700 -o builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/id_ed25519
          # The AUR's host key, checked against the fingerprint on aur.archlinux.org.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > /home/builder/.ssh/known_hosts
          chown -R builder /home/builder/.ssh .
          chmod 600 /home/builder/.ssh/id_ed25519
          su builder -c "packaging/aur/publish.sh '${GITHUB_REF_NAME#v}' --push"
